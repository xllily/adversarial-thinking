name: Offline validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline validation (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - name: Check out source and frozen history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run harness tests
        run: python -m unittest discover -s evals/harness -p 'test_*.py' -v
      - name: Run frozen pilot tests
        run: python -m unittest discover -s evals/campaigns/t1_pilot_v1 -p 'test_*.py' -v
      - name: Verify frozen pilot source
        run: python evals/campaigns/t1_pilot_v1/pilot.py verify
      - name: Run controller self-test
        run: python evals/harness/eval.py self-test
      - name: Check changed-line whitespace
        run: git diff --check HEAD^ HEAD
